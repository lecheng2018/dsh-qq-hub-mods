name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-ubuntu:
    name: Quality / Validate (Ubuntu)
    uses: ./.github/workflows/quality.yml
    with:
      runner: ubuntu-latest
      strict-host: false
      upload-release-artifact: false
      base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  validate-windows:
    name: Quality / Validate (Windows)
    uses: ./.github/workflows/quality.yml
    with:
      runner: windows-latest
      strict-host: false
      upload-release-artifact: false
      base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  quality-gate:
    name: Quality Gate
    if: always()
    needs: [validate-ubuntu, validate-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform validations
        env:
          UBUNTU_RESULT: ${{ needs.validate-ubuntu.result }}
          WINDOWS_RESULT: ${{ needs.validate-windows.result }}
        run: |
          test "$UBUNTU_RESULT" = success
          test "$WINDOWS_RESULT" = success
