name: Release
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'revoked.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/release.yml'
      - '.github/host-contract.json'
      - 'schemas/**'
      - 'templates/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validate-ubuntu:
    name: Release Quality / Validate (Ubuntu)
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      runner: ubuntu-latest
      strict-host: true
      upload-release-artifact: true
  validate-windows:
    name: Release Quality / Validate (Windows)
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      runner: windows-latest
      strict-host: true
      upload-release-artifact: false
  publish:
    name: Publish verified artifacts
    needs: [validate-ubuntu, validate-windows]
    if: ${{ needs.validate-ubuntu.result == 'success' && needs.validate-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the artifact's exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the Linux build from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ github.sha }}
          path: dist/
      - name: Publish verified assets and update registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --dist dist --commit "$GITHUB_SHA" --revoked revoked.json
