name: Release
on:
  push:
    branches: [main]
    paths: ['modules/**', 'revoked.json']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - name: 打包（只打还没发布过的版本）
        run: node scripts/pack.mjs --out dist --missing
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 每模块一个 Release（zip + release.json）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs = require("fs")
            const release = JSON.parse(fs.readFileSync("dist/release.json", "utf8"))
            for (const e of release) console.log([e.tag, e.id, e.name, e.version].join("\t"))
          ' | while IFS=$'\t' read -r tag id name version; do
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag 已存在，跳过"; continue; fi
            node -e "const r=JSON.parse(require('fs').readFileSync('dist/release.json','utf8'));require('fs').writeFileSync('dist/$id-release.json',JSON.stringify(r.find(x=>x.id==='$id'),null,2))"
            gh release create "$tag" "dist/$id.zip" "dist/$id-release.json" --title "$name v$version" --notes "sha256 见 release.json；安装请走插件面板「模块市场」。"
          done
      - name: 推 registry 索引
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/push-registry.sh dist/release.json
